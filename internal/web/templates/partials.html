{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>signum</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a href="/">signum</a>
  <a href="/printers">printers</a>
  {{with .Viewer}}<span class="muted" style="margin-left:auto">{{.Handle}}</span>{{end}}
</nav>
{{end}}

{{define "bottom"}}
<script>
/* Times arrive as UTC <time> elements; the reader's browser knows the
   reader's clock. */
for (const el of document.querySelectorAll('time[datetime]')) {
  const d = new Date(el.getAttribute('datetime'));
  if (isNaN(d)) continue;
  const day = {month: 'short', day: 'numeric'};
  if (d.getFullYear() !== new Date().getFullYear()) day.year = 'numeric';
  el.textContent = d.toLocaleDateString([], day) + ', ' +
    d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
}
</script>
</body>
</html>
{{end}}
